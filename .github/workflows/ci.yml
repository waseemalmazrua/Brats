name: CI Pipeline

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4        # ← v4

      - name: Set up Python
        uses: actions/setup-python@v5    # ← v5
        with:
          python-version: '3.11'

      - name: Install uv
        run: pip install uv

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Run tests
        run: uv run pytest               # ← uv run

      - name: Build FastAPI image
        run: docker build -t fastapi -f app/dockerfile . 

      - name: Build Bento image
        run: docker build -t bento -f services/bento/dockerfile .