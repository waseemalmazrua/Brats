name: CI Pipeline

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        run: pip install uv

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Start test database
        run: docker compose -f docker-compose.test.yml up -d

      - name: Wait for PostgreSQL
        run: |
          echo "Waiting for postgres..."
          sleep 5

      - name: Run tests
        env:
          DATABASE_URL: postgresql://test:test@localhost:5436/test_db
          DATABASE_URL_PROD: postgresql://test:test@localhost:5436/test_db
          IS_DEV: true
          ALLOW_ORIGINS: http://localhost:5173
          ALGORITHM: HS256
          AUTH0_DOMAIN: test.auth0.com
          AUTH0_AUDIENCE: test-audience
          MLFLOW_MODEL_URI: models:/test/1
          BENTO_MODEL_NAME: test_model
          MLFLOW_TRACKING_URI: http://localhost:5000
          BENTOML_MODEL_TAG: test:latest
          BENTO_URL: http://localhost:3000
          GOOGLE_APPLICATION_CREDENTIALS: '{}'
          OPENAI_API_KEY: sk-test-fake
        run: uv run pytest tests/ -v

      - name: Stop test database
        if: always()
        run: docker compose -f docker-compose.test.yml down

      - name: Run Migrations
        run: uv run alembic -c app/alembic.ini upgrade head
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PROD }}
          DATABASE_URL_PROD: ${{ secrets.DATABASE_URL_PROD }}
          IS_DEV: false
          ALLOW_ORIGINS: https://brats-3d.web.app
          ALGORITHM: HS256
          AUTH0_DOMAIN: placeholder
          AUTH0_AUDIENCE: placeholder
          MLFLOW_MODEL_URI: placeholder
          BENTO_MODEL_NAME: placeholder
          MLFLOW_TRACKING_URI: placeholder
          BENTOML_MODEL_TAG: placeholder
          BENTO_URL: placeholder
          GOOGLE_APPLICATION_CREDENTIALS: '{}'
          OPENAI_API_KEY: placeholder

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configure Docker for GCR
        run: gcloud auth configure-docker --quiet

      - name: Build and Push FastAPI image
        run: |
          docker build -t gcr.io/brats-488801/fastapi -f app/dockerfile .
          docker push gcr.io/brats-488801/fastapi

      - name: Build and Push Bento image
        run: |
          docker build -t gcr.io/brats-488801/bento -f services/bento/dockerfile .
          docker push gcr.io/brats-488801/bento

      - name: Deploy FastAPI to Cloud Run
        run: |
          gcloud run deploy fastapi \
            --image gcr.io/brats-488801/fastapi \
            --platform managed \
            --region us-central1 \
            --allow-unauthenticated \
            --port 8080 \
            --set-env-vars DATABASE_URL="${{ secrets.DATABASE_URL_PROD }}",ALGORITHM="RS256",AUTH0_DOMAIN="${{ secrets.VITE_AUTH0_DOMAIN }}",AUTH0_AUDIENCE="${{ secrets.VITE_AUTH0_AUDIENCE }}",ALLOW_ORIGINS="https://brats-3d.web.app",IS_DEV=false

      - name: Deploy Bento to Cloud Run
        run: |
          gcloud run deploy bento \
            --image gcr.io/brats-488801/bento \
            --platform managed \
            --region us-central1 \
            --allow-unauthenticated \
            --port 3000 \
            --set-env-vars DATABASE_URL="${{ secrets.DATABASE_URL_PROD }}",ALGORITHM="RS256",AUTH0_DOMAIN="${{ secrets.VITE_AUTH0_DOMAIN }}",AUTH0_AUDIENCE="${{ secrets.VITE_AUTH0_AUDIENCE }}",IS_DEV=false

      - name: Build Frontend
        run: |
          cd frontend
          npm ci
          npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_BENTO_URL: ${{ secrets.VITE_BENTO_URL }}
          VITE_AUTH0_DOMAIN: ${{ secrets.VITE_AUTH0_DOMAIN }}
          VITE_AUTH0_CLIENT_ID: ${{ secrets.AUTH0_CLIENT_ID }}
          VITE_AUTH0_AUDIENCE: ${{ secrets.VITE_AUTH0_AUDIENCE }}

      - name: Deploy Frontend to Firebase
        run: |
          npm install -g firebase-tools
          cd frontend
          firebase deploy --only hosting --token ${{ secrets.FIREBASE_TOKEN }}