name: CI Pipeline

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        run: pip install uv

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Start test database
        run: docker compose -f docker-compose.test.yml up -d

      - name: Wait for PostgreSQL
        run: |
          echo "Waiting for postgres..."
          sleep 5

      - name: Run tests
        env:
          DATABASE_URL: postgresql://test:test@localhost:5436/test_db
          DATABASE_URL_PROD: postgresql://test:test@localhost:5436/test_db
          IS_DEV: true
          ALLOW_ORIGINS: http://localhost:5173
          ALGORITHM: HS256
          AUTH0_DOMAIN: test.auth0.com
          AUTH0_AUDIENCE: test-audience
          MLFLOW_MODEL_URI: models:/test/1
          BENTO_MODEL_NAME: test_model
          MLFLOW_TRACKING_URI: http://localhost:5000
          BENTOML_MODEL_TAG: test:latest
          BENTO_URL: http://localhost:3000
          GOOGLE_APPLICATION_CREDENTIALS: '{}'
          OPENAI_API_KEY: sk-test-fake
        run: uv run pytest tests/ -v

      - name: Stop test database
        if: always()
        run: docker compose -f docker-compose.test.yml down

      - name: Run Migrations
        run: uv run alembic -c app/alembic.ini upgrade head
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PROD }}
          DATABASE_URL_PROD: ${{ secrets.DATABASE_URL_PROD }}
          IS_DEV: false
          ALLOW_ORIGINS: https://brats-3d.web.app
          ALGORITHM: HS256
          AUTH0_DOMAIN: placeholder
          AUTH0_AUDIENCE: placeholder
          MLFLOW_MODEL_URI: placeholder
          BENTO_MODEL_NAME: placeholder
          MLFLOW_TRACKING_URI: placeholder
          BENTOML_MODEL_TAG: placeholder
          BENTO_URL: placeholder
          GOOGLE_APPLICATION_CREDENTIALS: '{}'
          OPENAI_API_KEY: placeholder

      - name: Build FastAPI image
        run: docker build -t fastapi -f app/dockerfile .

      - name: Build Bento image
        run: docker build -t bento -f services/bento/dockerfile .